name: qwen-measured-fallback

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model id
        required: true
        default: Qwen/Qwen3-0.6B
        type: string
      fallback_threshold:
        description: Confidence threshold below which System-2 runs
        required: true
        default: "0.80"
        type: string

jobs:
  measured-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      MODEL: ${{ inputs.model || 'Qwen/Qwen3-0.6B' }}
      FALLBACK_THRESHOLD: ${{ inputs.fallback_threshold || '0.80' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-${{ env.MODEL }}

      - name: Install model experiment dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[models]"

      - name: Run real Qwen fast-path plus System-2 fallback
        run: |
          mkdir -p artifacts
          python examples/run_qwen_comparison.py \
            --model "$MODEL" \
            --calibration benchmarks/mcp_tool_router/v1.calibration.jsonl \
            --test benchmarks/mcp_tool_router/v1.test.jsonl \
            --fallback-threshold "$FALLBACK_THRESHOLD" \
            --output artifacts/qwen-comparison.json \
            --frozen-eval-artifact artifacts/frozen-logits.decision-eval.json \
            --structured-eval-artifact artifacts/structured-output.decision-eval.json

      - name: Verify release-facing decision artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from decision_lab.contract_matrix import build_contract_matrix
          from decision_lab.eval_artifact import verify_eval_artifact

          report = json.loads(
              Path("artifacts/qwen-comparison.json").read_text(encoding="utf-8")
          )
          frozen = json.loads(
              Path("artifacts/frozen-logits.decision-eval.json").read_text(
                  encoding="utf-8"
              )
          )
          structured = json.loads(
              Path("artifacts/structured-output.decision-eval.json").read_text(
                  encoding="utf-8"
              )
          )
          fallback = report["system2_fallback"]

          if fallback.get("measured") is not True:
              raise SystemExit("fallback_evaluation.measured is not true")
          if fallback.get("fallback_case_count", 0) <= 0:
              raise SystemExit(
                  "selected threshold exercised zero System-2 fallback cases; "
                  "choose a higher threshold and rerun"
              )
          for field in (
              "p50_latency_ms",
              "p95_latency_ms",
              "mean_tokens_processed",
              "parse_valid_rate",
          ):
              if fallback.get(field) is None:
                  raise SystemExit(f"missing measured fallback field: {field}")

          for name, artifact in (
              ("frozen", frozen),
              ("structured", structured),
          ):
              if not verify_eval_artifact(artifact):
                  raise SystemExit(f"{name} decision-eval artifact is invalid")
              calibration = artifact.get("calibration")
              if not isinstance(calibration, dict):
                  raise SystemExit(f"{name} calibration provenance is missing")
              if calibration.get("sha256") != artifact.get("calibration_sha256"):
                  raise SystemExit(f"{name} calibration digest alias mismatch")

          if frozen["fallback_evaluation"].get("measured") is not True:
              raise SystemExit("frozen artifact lost measured fallback evidence")
          if structured["fallback_evaluation"].get("measured") is not False:
              raise SystemExit("Structured Output baseline must not claim fallback")

          matrix = build_contract_matrix([frozen, structured])
          Path("artifacts/decision-contract-matrix.json").write_text(
              json.dumps(matrix, indent=2) + "\n",
              encoding="utf-8",
          )
          if len(matrix["rows"]) != 2:
              raise SystemExit("expected exactly two release-facing baseline rows")

          print(
              json.dumps(
                  {
                      "frozen_artifact_id": frozen["artifact_id"],
                      "structured_artifact_id": structured["artifact_id"],
                      "dataset_sha256": matrix["dataset"]["sha256"],
                      "calibration_sha256": frozen["calibration_sha256"],
                      "fallback_case_count": fallback["fallback_case_count"],
                      "fallback_rate": fallback["fallback_rate"],
                      "fallback_accuracy": fallback["accuracy"],
                      "fallback_p95_latency_ms": fallback["p95_latency_ms"],
                  },
                  indent=2,
              )
          )
          PY

      - name: Capture execution environment
        if: always()
        run: |
          {
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "model=$MODEL"
            echo "fallback_threshold=$FALLBACK_THRESHOLD"
            echo "--- python ---"
            python --version
            echo "--- uname ---"
            uname -a
            echo "--- cpu ---"
            lscpu || true
            echo "--- memory ---"
            free -h || true
            echo "--- gpu ---"
            nvidia-smi || true
          } > artifacts/environment.txt

      - name: Upload measured experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-measured-fallback-${{ github.run_id }}
          path: |
            artifacts/qwen-comparison.json
            artifacts/frozen-logits.decision-eval.json
            artifacts/structured-output.decision-eval.json
            artifacts/decision-contract-matrix.json
            artifacts/environment.txt
          if-no-files-found: warn
          retention-days: 30
