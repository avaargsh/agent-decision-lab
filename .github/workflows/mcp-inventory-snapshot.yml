name: mcp-inventory-snapshot

on:
  pull_request:
    paths:
      - "src/decision_lab/inventory.py"
      - "src/decision_lab/inventory_extract.py"
      - "scripts/extract_mcp_inventory.py"
      - ".github/workflows/mcp-inventory-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awslabs-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark package
        run: pip install -e .

      - name: Checkout pinned AWS Labs MCP source
        uses: actions/checkout@v4
        with:
          repository: awslabs/mcp
          ref: 5abe7e82ba70556f80d2f42558d63a20aa3ce56c
          path: .upstream/awslabs-mcp
          sparse-checkout: |
            src

      - name: Extract content-addressed tool inventory
        run: |
          mkdir -p artifacts
          python scripts/extract_mcp_inventory.py \
            --root .upstream/awslabs-mcp \
            --repository awslabs/mcp \
            --revision 5abe7e82ba70556f80d2f42558d63a20aa3ce56c \
            --inventory-id awslabs-mcp@5abe7e82ba70 \
            --output artifacts/awslabs-mcp.inventory.json

      - name: Verify frozen inventory identity
        run: |
          python - <<'PY'
          from decision_lab.inventory import load_inventory, inventory_digest

          EXPECTED_COUNT = 804
          EXPECTED_DIGEST = (
              "9e36175089bbba8714ad9e5db5efddd92812516937cf8acd3c124d61517e3d67"
          )

          inventory = load_inventory("artifacts/awslabs-mcp.inventory.json")
          count = len(inventory.tools)
          digest = inventory_digest(inventory)

          print(f"tool_count={count}")
          print(f"sha256={digest}")

          if count != EXPECTED_COUNT:
              raise SystemExit(
                  f"inventory count drift: expected {EXPECTED_COUNT}, got {count}"
              )
          if digest != EXPECTED_DIGEST:
              raise SystemExit(
                  "inventory digest drift: "
                  f"expected {EXPECTED_DIGEST}, got {digest}"
              )
          PY

      - name: Upload frozen inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: awslabs-mcp-inventory-5abe7e82ba70
          path: artifacts/awslabs-mcp.inventory.json
          if-no-files-found: error
