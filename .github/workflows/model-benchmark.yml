name: model-benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face causal LM checkpoint
        required: true
        default: Qwen/Qwen3-0.6B
      calibration:
        description: Calibration JSONL path
        required: true
        default: benchmarks/mcp_tool_router/v1.calibration.jsonl
      test:
        description: Test JSONL path
        required: true
        default: benchmarks/mcp_tool_router/v1.test.jsonl
      fallback_threshold:
        description: Confidence threshold for System-2 fallback
        required: true
        default: "0.8"
  push:
    paths:
      - ".github/model-benchmark.trigger"

jobs:
  decision-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -U pip

      - name: Install model benchmark dependencies
        run: pip install -e ".[models]"

      - name: Run same-base decision comparison
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL: ${{ inputs.model || 'Qwen/Qwen3-0.6B' }}
          CALIBRATION: ${{ inputs.calibration || 'benchmarks/mcp_tool_router/v1.calibration.jsonl' }}
          TEST_DATASET: ${{ inputs.test || 'benchmarks/mcp_tool_router/v1.test.jsonl' }}
          FALLBACK_THRESHOLD: ${{ inputs.fallback_threshold || '0.8' }}
        run: |
          mkdir -p reports
          python examples/run_qwen_comparison.py \
            --model "$MODEL" \
            --calibration "$CALIBRATION" \
            --test "$TEST_DATASET" \
            --fallback-threshold "$FALLBACK_THRESHOLD" \
            --output reports/qwen-comparison.json \
            --eval-artifact reports/decision-eval.json

      - name: Validate measured fallback evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from decision_lab.eval_artifact import verify_eval_artifact

          report = json.loads(
              Path("reports/qwen-comparison.json").read_text(encoding="utf-8")
          )
          artifact = json.loads(
              Path("reports/decision-eval.json").read_text(encoding="utf-8")
          )

          fallback = report["system2_fallback"]
          assert fallback["measured"] is True, fallback
          assert fallback["fallback_case_count"] > 0, fallback
          assert fallback["p50_latency_ms"] is not None, fallback
          assert fallback["p95_latency_ms"] is not None, fallback
          assert fallback["mean_tokens_processed"] is not None, fallback
          assert fallback["parse_valid_rate"] is not None, fallback

          assert artifact["fallback_evaluation"]["measured"] is True, artifact
          assert artifact["fallback_evaluation"]["fallback_case_count"] > 0, artifact
          assert artifact["calibration_sha256"].startswith("sha256:"), artifact
          assert artifact["dataset"]["case_count"] > 0, artifact
          assert verify_eval_artifact(artifact), artifact
          PY

      - name: Capture environment and hardware
        if: always()
        run: |
          mkdir -p reports
          {
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "--- python ---"
            python --version
            echo "--- uname ---"
            uname -a
            echo "--- cpu ---"
            lscpu || true
            echo "--- memory ---"
            free -h || true
            echo "--- gpu ---"
            nvidia-smi || true
            echo "--- packages ---"
            python -m pip freeze
          } > reports/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-model-comparison
          path: reports/
