name: model-benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face causal LM checkpoint
        required: true
        default: Qwen/Qwen3-0.6B
      calibration:
        description: Calibration JSONL path
        required: true
        default: benchmarks/demo/tool_router.calibration.jsonl
      test:
        description: Test JSONL path
        required: true
        default: benchmarks/demo/tool_router.test.jsonl
  push:
    paths:
      - ".github/model-benchmark.trigger"

jobs:
  decision-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -U pip

      - name: Install model benchmark dependencies
        run: pip install -e ".[models]"

      - name: Run same-base decision comparison
        env:
          MODEL: ${{ inputs.model || 'Qwen/Qwen3-0.6B' }}
          CALIBRATION: ${{ inputs.calibration || 'benchmarks/demo/tool_router.calibration.jsonl' }}
          TEST_DATASET: ${{ inputs.test || 'benchmarks/demo/tool_router.test.jsonl' }}
        run: |
          mkdir -p reports
          python examples/run_qwen_comparison.py \
            --model "$MODEL" \
            --calibration "$CALIBRATION" \
            --test "$TEST_DATASET" \
            --output reports/qwen-comparison.json

      - name: Capture environment and hardware
        if: always()
        run: |
          mkdir -p reports
          {
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "--- python ---"
            python --version
            echo "--- uname ---"
            uname -a
            echo "--- cpu ---"
            lscpu || true
            echo "--- memory ---"
            free -h || true
            echo "--- gpu ---"
            nvidia-smi || true
            echo "--- packages ---"
            python -m pip freeze
          } > reports/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-model-comparison
          path: reports/
