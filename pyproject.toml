[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-decision-lab"
version = "0.1.0"
description = "Calibrated decision gateway experiments for bounded Agent decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
models = [
  "torch>=2.4",
  "transformers>=4.50",
  "accelerate>=1.0",
]
otel = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
]

[project.scripts]
decision-lab = "decision_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_lab"]
